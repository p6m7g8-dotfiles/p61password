name: Enqueue PR to Merge Queue (after CI)

on:
  workflow_run:
    workflows: ["Build", "Codex Code Review"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to enqueue"
        required: true
        type: string

jobs:
  enqueue:
    runs-on: ubuntu-latest
    name: Enqueue PR to Merge Queue (after CI)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR number
        id: pr
        env:
          INPUT_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            PR="$INPUT_PR"
          else
            PR=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Enqueue PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          echo "Queueing PR #$PR in $REPO"
          gh pr merge --squash -R "$REPO" "$PR"
