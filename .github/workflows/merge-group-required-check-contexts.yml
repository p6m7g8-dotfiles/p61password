name: Merge Group Required Check Contexts

on:
  merge_group:
    types: [checks_requested]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "merge_group event: claude-review context satisfied"'

  codex-review:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "merge_group event: codex-review context satisfied"'

  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "merge_group event: Lint PR title context satisfied"'
