name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - gh-readonly-queue/**
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: p6m7g8-actions/p6df-build@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
